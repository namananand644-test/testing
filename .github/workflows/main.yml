
name: My First CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Say Hello
        run: echo "GitHub Actions is checking this code!"

      - name: Show files
        run: ls -la

      - name: Show Python version
        run: python3 --version
