
name: My First CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello
        run: echo "Hello! My GitHub Actions runner is working."

      - name: Show current directory
        run: pwd

      - name: Show files
        run: ls -la

      - name: Show Python version
        run: python3 --version
