
name: My First CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Say Hello
        run: echo "GitHub Actions is checking this code!"

      - name: Show files
        run: ls -la

      - name: Show Python version
        run: python3 --version

  merge-pr:
    needs: first-job
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Enable automatic PR merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --merge
